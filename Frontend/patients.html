<!DOCTYPE html>

<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пациенты - Реестр вакцинированных</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <div class="logo">
            <div class="logo-icon">💉</div>
            <span>Реестр вакцинированных</span>
        </div>

        <div class="nav-links">
            <a href="vaccines.html" class="nav-link">Перейти к списку вакцин</a>
            <a href="login.html" class="nav-link">Выйти</a>
        </div>
    </header>

    <main>
        <div class="page-header">
            <h1 class="page-title">Пациенты</h1>
            <p class="page-subtitle">Список зарегистрированных пользователей</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Всего:</div>
                <div class="stat-value" id="statTotal">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Отфильтровано:</div>
                <div class="stat-value" id="statFiltered">—</div>
            </div>
        </div>

        <div class="toolbar">
            <div class="search-wrap">
                <span class="search-icon">🔍</span>
                <input class="search-input"
                       type="text"
                       id="searchInput"
                       placeholder="Поиск по ФИО или СНИЛС..." />
            </div>
            <button class="btn btn-ghost" onclick="loadUsers()">↺ Обновить</button>
            <button class="btn btn-ghost" onclick="openAddModal()">Добавить пациента</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ФИО</th>
                        <th>Дата рождения</th>
                        <th>СНИЛС</th>
                        <th>Телефон</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    
                </tbody>
            </table>
            <div id="tableState"></div>
        </div>
    </main>

    <!------ МОДАЛЬНОЕ ОКНО - добавить пользователя --------------->
    <div class="modal-overlay" id="addModalOverlay">
        <div class="modal">
            <div class="modal-header">        
                <h2 class="modal-name">Новый пользователь</h2>
                <button class="modal-close" id="addModalClose">✕</button>
            </div>

            <div class="form-error" id="addModalError" style="display:none"></div>

            <div class="form-grid">

                <div class="form-field">
                    <label>Фамилия *</label>
                    <input type="text" id="fieldLastName" placeholder="Иванов"/>
                </div>

                <div class="form-field">
                    <label>Имя *</label>
                    <input type="text" id="fieldFirstName" placeholder="Иван"/>
                </div>

                <div class="form-field">
                    <label>Отчество *</label>
                    <input type="text" id="fieldMiddleName" placeholder="Иванович"/>
                </div>

                <div class="form-field">
                    <label>Дата рождения *</label>
                    <input type="date" id="fieldDateOfBirth"/>
                </div>

                <div class="form-field">
                    <label>СНИЛС * (11 цифр)</label>
                    <input type="text" id="fieldSnils" placeholder="12345678901"/>
                    <span class="field-hint" id="snilsHint"></span>
                </div>

                <div class="form-field">
                    <label>Телефон *</label>
                    <input type="text" id="fieldPhone"/>
                </div>

                <div class="form-field">
                    <label>Email *</label>
                    <input type="email" id="fieldEmail"/>
                </div>

                <div class="form-field">
                    <label>Придумайте пароль * (минимум 6 символов)</label>
                    <input type="password" id="fieldPassword"/>
                </div>

                <div class="form-field">
                    <label>Роль *</label>
                     <select id="fieldRole">
                        <option value="">Выберите роль</option>
                        <option value="1">Пациент</option>
                        <option value="2">Врач</option>
                        <option value="3">Администратор</option>
                     </select>
                </div>
            </div>

            <div class="form-actions">
                <button class="btn btn-ghost" id="addModalCancel">Отмена</button>
                <button class="btn btn-primary" onclick="saveUser()">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="patients.js"></script>
</body>
</html>

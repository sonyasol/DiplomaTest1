<!DOCTYPE html>

<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вакцины</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <div class="logo">
            <div class="logo-icon">💉</div>
            <span>Реестр вакцинированных</span>
        </div>

        <div class="nav-links">
            <a href="patients.html" class="nav-link">Перейти к списку пациентов</a>
        </div>
    </header>

    <main>
        <div class="page-header">
            <h1 class="page-title">Вакцины</h1>
            <p class="page-subtitle">Список иммунобиологических лекарственных препаратов</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Всего:</div>
                <div class="stat-value" id="statTotal">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Отфильтровано:</div>
                <div class="stat-value" id="statFiltered">—</div>
            </div>
        </div>

        <div class="toolbar">
            <div class="search-wrap">
                <span class="search-icon">🔍</span>
                <input class="search-input"
                       type="text"
                       id="searchInput"
                       placeholder="Поиск по названию..." />
            </div>
            <button class="btn btn-ghost" onclick="loadVaccines()">↺ Обновить</button>
            <button class="btn btn-ghost" onclick="openAddModal()">Добавить вакцину</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Название</th>
                        <th>Серия</th>
                        <th>Срок годности</th>
                        <th>Инфекция</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    
                </tbody>
            </table>
            <div id="tableState"></div>
        </div>

    </main>

        <!------ МОДАЛЬНОЕ ОКНО - добавить вакцину --------------->
    <div class="modal-overlay" id="addModalOverlay">
        <div class="modal">

            <div class="modal-header">        
                <h2 class="modal-name">Новый пользователь</h2>
                <button class="modal-close" id="addModalClose">✕</button>
            </div>

            <div class="form-error" id="addModalError" style="display:none"></div>

            <div class="form-grid">

                <div class="form-field">
                    <label>Название *</label>
                    <input type="text" id="fieldName"/>
                </div>

                <div class="form-field">
                    <label>Серия *</label>
                    <input type="text" id="fieldSeries"/>
                </div>

                <div class="form-field">
                    <label>Срок годности *</label>
                    <input type="date" id="fieldExpiryDate"/>
                </div>

                <div class="form-field">
                    <label>Инфекция *</label>
                     <select id="fieldInfection">
                        <option value="">Выберите инфекцию</option>
                     </select>
                </div>
            </div>

            <div class="form-actions">
                <button class="btn btn-ghost" id="addModalCancel">Отмена</button>
                <button class="btn btn-primary" onclick="saveVaccine()">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="vaccines.js"></script>  
</body>
</html>
